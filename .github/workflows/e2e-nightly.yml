name: E2E Nightly

on:
  schedule:
    # 02:17 北京时间
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright against production build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start dependencies
        run: docker compose up -d mysql redis minio minio-init

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 60); do
            if docker exec tm-mysql mysqladmin ping -h127.0.0.1 -uroot -proot --silent; then
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready" >&2
          docker compose logs mysql
          exit 1

      - name: Build backend
        working-directory: backend
        run: mvn -B -q -DskipTests package

      - name: Start backend
        env:
          SPRING_PROFILES_ACTIVE: local
          SERVER_PORT: '8080'
          DB_URL: jdbc:mysql://127.0.0.1:3306/travelmapper?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          DB_USERNAME: travelmapper
          DB_PASSWORD: travelmapper
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          TRAVELMAPPER_ADMIN_PASSWORD: Admin@123456
          TRAVELMAPPER_JWT_SECRET: e2e-jwt-secret-0123456789abcdef0123456789abcdef
          TRAVELMAPPER_AES_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          MAIL_ENABLED: 'false'
          MAIL_LOG_VERIFICATION_CODES: 'true'
          ALERT_ENABLED: 'false'
        run: |
          JAR="$(ls -1 backend/target/travelmapper-backend-*.jar | grep -v '\.original$' | head -1)"
          nohup java -jar "$JAR" > backend-e2e.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy" >&2
          tail -200 backend-e2e.log || true
          exit 1

      - name: Configure object storage
        run: |
          curl -fsS -X PUT http://localhost:8080/api/admin/config/oss \
            -H 'Content-Type: application/json' \
            -H 'X-User-Id: 1' -H 'X-User-Role: ADMIN' \
            -d '{"provider":"minio","endpoint":"http://127.0.0.1:9000","bucket":"travelmapper","accessKey":"minioadmin","secretKey":"minioadmin","pathStyle":true}'

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E against production build
        working-directory: frontend
        env:
          CI: 'true'
          E2E_PREVIEW: '1'
          E2E_BACKEND_LOG: ${{ github.workspace }}/backend-e2e.log
          E2E_ADMIN_ACCOUNT: admin
          E2E_ADMIN_PASSWORD: Admin@123456
          E2E_REDIS_CONTAINER: tm-redis
          E2E_MYSQL_CONTAINER: tm-mysql
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
            backend-e2e.log
          retention-days: 7

      - name: Stop backend and dependencies
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" || true
          fi
          docker compose down -v || true