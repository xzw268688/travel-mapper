name: CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit tests
        working-directory: backend
        run: mvn -B -q test
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit and integration tests
        working-directory: backend
        run: mvn -B -q verify
      - name: Upload failsafe reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-failsafe-reports
          path: backend/target/failsafe-reports
          retention-days: 7

  timezone-matrix:
    name: Timezone matrix (UTC host and DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      MAVEN_OPTS: -Duser.timezone=UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run timezone integration tests with UTC server and DB
        working-directory: backend
        run: >-
          mvn -B -q verify
          -DargLine=-Duser.timezone=UTC
          -Dtest.mysql.time-zone=+00:00
          -Dit.test=TimezoneIntegrationTest,FeedbackIntegrationTest
      - name: Upload failsafe reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: timezone-matrix-reports
          path: backend/target/failsafe-reports
          retention-days: 7

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Unit tests with coverage
        working-directory: frontend
        run: npm run test:unit:coverage
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
      - name: Bundle budget
        working-directory: frontend
        run: npm run budget
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7
          if-no-files-found: ignore

  # 保留一个稳定的 job 名称，供 release.sh 查询整体门禁结果。
  ci:
    name: CI gate
    runs-on: ubuntu-latest
    needs:
      - backend-unit
      - backend-integration
      - timezone-matrix
      - frontend
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "backend-unit=${{ needs['backend-unit'].result }}"
          echo "backend-integration=${{ needs['backend-integration'].result }}"
          echo "timezone-matrix=${{ needs['timezone-matrix'].result }}"
          echo "frontend=${{ needs['frontend'].result }}"
          if [ "${{ needs['backend-unit'].result }}" != "success" ] || \
             [ "${{ needs['backend-integration'].result }}" != "success" ] || \
             [ "${{ needs['timezone-matrix'].result }}" != "success" ] || \
             [ "${{ needs['frontend'].result }}" != "success" ]; then
            echo "::error::CI gate failed"
            exit 1
          fi