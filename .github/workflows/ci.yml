name: CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit tests
        working-directory: backend
        run: mvn -B -q test
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Docker 29 把最低 API 提高到 1.44，Testcontainers 1.20.x 的 Docker 客户端
    # 无法完成协商。集成测试改用 runner 上的 service containers + 外部容器模式。
    services:
      mysql:
        image: mysql:8.0
        env:
          TZ: Asia/Shanghai
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: travelmapper
          MYSQL_USER: travelmapper
          MYSQL_PASSWORD: travelmapper
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      s3mock:
        image: adobe/s3mock:latest
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: travelmapper,travelmapper2
        ports:
          - 19090:9090
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Wait for object storage
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19090/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "S3Mock did not become ready" >&2
          exit 1
      - name: Run unit and integration tests
        working-directory: backend
        run: |
          mvn -B -q verify \
            -Dtest.containers.enabled=false \
            '-Dtest.mysql.url=jdbc:mysql://127.0.0.1:3306/travelmapper?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true' \
            -Dtest.mysql.username=travelmapper \
            -Dtest.mysql.password=travelmapper \
            -Dtest.mysql.admin-username=root \
            -Dtest.mysql.admin-password=root \
            -Dtest.redis.host=127.0.0.1 \
            -Dtest.redis.port=6379 \
            -Dtest.object-storage.endpoint=http://127.0.0.1:19090 \
            -Dtest.object-storage.access-key=test \
            -Dtest.object-storage.secret-key=test
      - name: Upload failsafe reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-failsafe-reports
          path: backend/target/failsafe-reports
          retention-days: 7

  timezone-matrix:
    name: Timezone matrix (UTC host and DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      MAVEN_OPTS: -Duser.timezone=UTC
    services:
      mysql:
        image: mysql:8.0
        env:
          TZ: UTC
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: travelmapper
          MYSQL_USER: travelmapper
          MYSQL_PASSWORD: travelmapper
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      s3mock:
        image: adobe/s3mock:latest
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: travelmapper,travelmapper2
        ports:
          - 19090:9090
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Wait for object storage
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19090/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "S3Mock did not become ready" >&2
          exit 1
      - name: Run timezone integration tests with UTC server and DB
        working-directory: backend
        run: |
          mvn -B -q verify \
            -Dtest.containers.enabled=false \
            '-Dtest.mysql.url=jdbc:mysql://127.0.0.1:3306/travelmapper?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true' \
            -Dtest.mysql.username=travelmapper \
            -Dtest.mysql.password=travelmapper \
            -Dtest.mysql.admin-username=root \
            -Dtest.mysql.admin-password=root \
            -Dtest.redis.host=127.0.0.1 \
            -Dtest.redis.port=6379 \
            -Dtest.object-storage.endpoint=http://127.0.0.1:19090 \
            -Dtest.object-storage.access-key=test \
            -Dtest.object-storage.secret-key=test \
            -DargLine=-Duser.timezone=UTC \
            -Dit.test=TimezoneIntegrationTest,FeedbackIntegrationTest
      - name: Upload failsafe reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: timezone-matrix-reports
          path: backend/target/failsafe-reports
          retention-days: 7

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Unit tests with coverage
        working-directory: frontend
        run: npm run test:unit:coverage
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
      - name: Bundle budget
        working-directory: frontend
        run: npm run budget
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7
          if-no-files-found: ignore

  # 保留一个稳定的 job 名称，供 release.sh 查询整体门禁结果。
  ci:
    name: CI gate
    runs-on: ubuntu-latest
    needs:
      - backend-unit
      - backend-integration
      - timezone-matrix
      - frontend
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "backend-unit=${{ needs['backend-unit'].result }}"
          echo "backend-integration=${{ needs['backend-integration'].result }}"
          echo "timezone-matrix=${{ needs['timezone-matrix'].result }}"
          echo "frontend=${{ needs['frontend'].result }}"
          if [ "${{ needs['backend-unit'].result }}" != "success" ] || \
             [ "${{ needs['backend-integration'].result }}" != "success" ] || \
             [ "${{ needs['timezone-matrix'].result }}" != "success" ] || \
             [ "${{ needs['frontend'].result }}" != "success" ]; then
            echo "::error::CI gate failed"
            exit 1
          fi