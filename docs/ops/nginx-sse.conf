# SPA 路由（/share/:token、/notes/:id、/poster/:id）需要回退到 index.html，
# 请在前端站点的 server 块中加入：
#   location / { try_files $uri $uri/ /index.html; }
# 分享链接与海报二维码指向 https://<frontend-host>/share/<token>。
#
# 生产环境默认关闭 Swagger UI 与 OpenAPI 文档（application-prod.yml），
# 不要为 /swagger-ui/、/swagger-ui.html、/v3/api-docs 配置反代。
# 接口清单请使用后台「监控 → 接口文档」；需要调试时在本地环境进行。

# Nginx: keep SSE unbuffered and allow the stream to outlive the model call.
location /api/ai/polish/stream {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    chunked_transfer_encoding on;
}
