# 放在 /root/my-docker-apps/nginx-conf/default.conf
# 公网 TLS 由 Cloudflare Tunnel 终止，这里只监听 80。
#
# 关键点：
#   - proxy_pass 不带结尾斜杠，保留后端 /api 前缀（带斜杠会 404）
#   - SSE 接口必须关闭缓冲并延长读超时
#   - /s/ 分享路径同样反代到后端

server {
    listen 80;
    server_name xuzhiwei.icu localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;
    charset utf-8;
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- SSE：必须放在 /api/ 前面，且关闭缓冲 ----
    location = /api/ai/polish/stream {
        proxy_pass http://java-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/country-guide/stream {
        proxy_pass http://java-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 普通 API ----
    location /api/ {
        # 不要加结尾斜杠：保留 /api 前缀，否则后端全部 404。
        proxy_pass http://java-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- 分享页（后端返回 JSON，由前端 /share/:token 渲染）----
    location /s/ {
        proxy_pass http://java-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 生产环境不对外暴露健康检查与接口文档（需要时可放开）。
    location /actuator/ { return 404; }
    location /swagger-ui/ { return 404; }
    location = /swagger-ui.html { return 404; }
    location /v3/api-docs { return 404; }

    # Vite 产物带内容哈希，可长缓存；index.html 不缓存，保证发版即时生效。
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vue History 路由刷新不回 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}